<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة العمر الدقيقة</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --primary-hover: #357abd;
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --text-muted: #666666;
            --border-color: #e1e4e8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 500px;
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: var(--primary-color);
            font-size: 24px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-muted);
            font-size: 14px;
        }

        input[type="date"] {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="date"]:focus {
            border-color: var(--primary-color);
        }

        .btn-container {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-calculate {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-calculate:hover {
            background-color: var(--primary-hover);
        }

        .btn-clear {
            background-color: #e4e6eb;
            color: var(--text-color);
        }

        .btn-clear:hover {
            background-color: #d8dadf;
        }

        .result-box {
            background-color: #f8f9fa;
            border-right: 4px solid var(--primary-color);
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .result-item {
            margin-bottom: 10px;
            font-size: 16px;
        }

        .result-item:last-child {
            margin-bottom: 0;
        }

        .result-item span {
            font-weight: bold;
            color: var(--primary-color);
        }

        /* حاوية الإعلان المنسقة */
        .ad-container {
            width: 100%;
            max-width: 728px;
            margin: 10px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            min-height: 90px;
        }

        @media (max-width: 768px) {
            .ad-container {
                max-width: 100%;
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>حاسبة العمر الدقيقة</h1>
        
        <div class="input-group">
            <label for="birthdate">اختر تاريخ ميلادك:</label>
            <input type="date" id="birthdate">
        </div>

        <div class="btn-container">
            <button class="btn-calculate" onclick="calculateAge()">احسب الآن</button>
            <button class="btn-clear" onclick="clearAll()">مسح</button>
        </div>

        <div class="result-box" id="resultBox">
            <div class="result-item">عمرك الحالي هو: <span id="years">0</span> سنة، و <span id="months">0</span> شهر، و <span id="days">0</span> يوم.</div>
            <div class="result-item">مجموع عمرك بالأيام: <span id="totalDays">0</span> يوم.</div>
            <div class="result-item">يوم ميلادك كان: <span id="dayName">-</span>.</div>
            <div class="result-item">الوقت المتبقي لعيد ميلادك القادم: <span id="nextBirthday">-</span>.</div>
        </div>
    </div>

    <div class="ad-container">
        <script>
          atOptions = {
            'key' : 'cc104dbd254bfee2473c808399a1b897',
            'format' : 'iframe',
            'height' : 90,
            'width' : 728,
            'params' : {}
          };
        </script>
        <script src="https://www.highperformanceformat.com/cc104dbd254bfee2473c808399a1b897/invoke.js"></script>
    </div>

    <script>
        function calculateAge() {
            const birthdateInput = document.getElementById('birthdate').value;
            if (!birthdateInput) {
                alert('الرجاء اختيار تاريخ ميلادك أولاً!');
                return;
            }

            const birthDate = new Date(birthdateInput);
            const today = new Date();

            if (birthDate > today) {
                alert('تاريخ الميلاد لا يمكن أن يكون في المستقبل!');
                return;
            }

            // حساب السنين والشهور والأيام
            let years = today.getFullYear() - birthDate.getFullYear();
            let months = today.getMonth() - birthDate.getMonth();
            let days = today.getDate() - birthDate.getDate();

            if (days < 0) {
                months--;
                const previousMonth = new Date(today.getFullYear(), today.getMonth(), 0);
                days += previousMonth.getDate();
            }

            if (months < 0) {
                years--;
                months += 12;
            }

            // إجمالي الأيام
            const diffTime = Math.abs(today - birthDate);
            const totalDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

            // اسم يوم الميلاد
            const daysOfWeek = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
            const dayName = daysOfWeek[birthDate.getDay()];

            // حساب عيد الميلاد القادم
            let nextBirthdayDate = new Date(today.getFullYear(), birthDate.getMonth(), birthDate.getDate());
            if (today > nextBirthdayDate) {
                nextBirthdayDate.setFullYear(today.getFullYear() + 1);
            }
            const diffToNext = nextBirthdayDate - today;
            const daysToNext = Math.ceil(diffToNext / (1000 * 60 * 60 * 24));

            let nextBirthdayText = `${daysToNext} يوم`;
            if (daysToNext === 365 || daysToNext === 0) {
                nextBirthdayText = "عيد ميلادك اليوم! كل عام وأنت بخير 🎉";
            }

            // عرض النتائج
            document.getElementById('years').innerText = years;
            document.getElementById('months').innerText = months;
            document.getElementById('days').innerText = days;
            document.getElementById('totalDays').innerText = totalDays;
            document.getElementById('dayName').innerText = dayName;
            document.getElementById('nextBirthday').innerText = nextBirthdayText;

            document.getElementById('resultBox').style.display = 'block';
        }

        function clearAll() {
            document.getElementById('birthdate').value = '';
            document.getElementById('resultBox').style.display = 'none';
        }
    </script>
</body>
</html>
