        .result-item span { font-weight: bold; color: #2563eb; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 900px) { .sidebar-ad { display: none; } body { justify-content: center; } }

    <script>
        // (نفس الكود الخاص بك للمنطق والحسابات لا تغيير عليه)
        window.onload = function() {
            const gregDay = document.getElementById('gregDay'); const hijriDay = document.getElementById('hijriDay');
            for (let d = 1; d <= 31; d++) {
                let opt = document.createElement('option'); opt.value = d; opt.innerText = d; gregDay.appendChild(opt);
                if(d <= 30) { let optH = document.createElement('option'); optH.value = d; optH.innerText = d; hijriDay.appendChild(optH); }
            }
            const gregYear = document.getElementById('gregYear'); const currentGregYear = new Date().getFullYear();
            for (let y = currentGregYear; y >= 1940; y--) { let opt = document.createElement('option'); opt.value = y; opt.innerText = y; gregYear.appendChild(opt); }
            const hijriYear = document.getElementById('hijriYear');
            for (let y = 1447; y >= 1360; y--) { let opt = document.createElement('option'); opt.value = y; opt.innerText = y; hijriYear.appendChild(opt); }
        };
        function toggleCalendarType() {
            const type = document.querySelector('input[name="calType"]:checked').value;
            document.getElementById('gregorianInput').style.display = type === 'gregorian' ? 'block' : 'none';
            document.getElementById('hijriInput').style.display = type === 'hijri' ? 'block' : 'none';
            document.getElementById("resultBox").style.display = "none";
        }
        function calculateAgeSelector() {
            // (بقية كود الحسابات كما هو)
            const type = document.querySelector('input[name="calType"]:checked').value;

        }
    </script>
