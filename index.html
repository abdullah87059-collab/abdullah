<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة العمر المتقدمة | هجري وميلادي</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 550px;
            border: 1px solid var(--border);
            margin-bottom: 25px;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: var(--primary);
            font-size: 26px;
        }

        .calendar-selector {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .selector-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--border);
            background: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .selector-btn.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #475569;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }

        .hijri-inputs {
            display: flex;
            gap: 10px;
        }

        .btn-container {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-calc { background-color: var(--primary); color: white; }
        .btn-calc:hover { background-color: var(--primary-hover); }
        .btn-clear { background-color: #e2e8f0; color: #334155; }
        .btn-clear:hover { background-color: #cbd5e1; }

        .result-box {
            background-color: #f1f5f9;
            border-right: 5px solid var(--primary);
            padding: 20px;
            border-radius: 10px;
            display: none;
        }

        .result-title {
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--primary);
            font-size: 18px;
        }

        .result-item {
            margin-bottom: 12px;
            font-size: 16px;
            line-height: 1.6;
        }

        .result-item span {
            font-weight: bold;
            color: var(--primary);
        }

        /* حاوية البنر الإعلاني الكلاسيكي */
        .ad-container {
            width: 100%;
            max-width: 728px;
            margin: 15px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            min-height: 90px;
        }

        @media (max-width: 768px) {
            .ad-container {
                max-width: 100%;
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>حاسبة العمر المتقدمة</h1>
        
        <div class="calendar-selector">
            <button class="selector-btn active" id="gregorianBtn" onclick="setCalendar('gregorian')">ميلادي</button>
            <button class="selector-btn" id="hijriBtn" onclick="setCalendar('hijri')">هجري</button>
        </div>

        <!-- المدخلات الميلادية -->
        <div id="gregorianInputSection" class="input-group">
            <label for="gregorianDate">اختر تاريخ ميلادك (ميلادي):</label>
            <input type="date" id="gregorianDate">
        </div>

        <!-- المدخلات الهجرية -->
        <div id="hijriInputSection" class="input-group" style="display: none;">
            <label>أدخل تاريخ ميلادك (هجري):</label>
            <div class="hijri-inputs">
                <input type="number" id="hijriDay" placeholder="يوم" min="1" max="30">
                <select id="hijriMonth">
                    <option value="1">1- محرم</option>
                    <option value="2">2- صفر</option>
                    <option value="3">3- ربيع الأول</option>
                    <option value="4">4- ربيع الآخر</option>
                    <option value="5">5- جمادى الأولى</option>
                    <option value="6">6- جمادى الآخرة</option>
                    <option value="7">7- رجب</option>
                    <option value="8">8- شعبان</option>
                    <option value="9">9- رمضان</option>
                    <option value="10">10- شوال</option>
                    <option value="11">11- ذو القعدة</option>
                    <option value="12">12- ذو الحجة</option>
                </select>
                <input type="number" id="hijriYear" placeholder="سنة" min="1300" max="1500">
            </div>
        </div>

        <div class="btn-container">
            <button class="btn btn-calc" onclick="processAgeCalculation()">احسب العمر الآن</button>
            <button class="btn btn-clear" onclick="resetForm()">مسح</button>
        </div>

        <!-- صندوق عرض النتائج الاحترافي -->
        <div class="result-box" id="resultBox">
            <div class="result-title">نتائج الحساب الدقيقة:</div>
            <div class="result-item">العمر بالتفصيل: <span id="resAge"></span></div>
            <div class="result-item">يوم ميلادك المصادف هو: <span id="resDayName"></span></div>
            <div class="result-item">الوقت المتبقي لعيد ميلادك القادم: <span id="resNextBirthday"></span></div>
        </div>
    </div>

    <!-- مساحة الإعلان التابعة لك وبمقاسها الصحيح دون التأثير على التصميم -->
    <div class="ad-container">
        <script>
          atOptions = {
            'key' : 'cc104dbd254bfee2473c808399a1b897',
            'format' : 'iframe',
            'height' : 90,
            'width' : 728,
            'params' : {}
          };
        </script>
        <script src="https://www.highperformanceformat.com/cc104dbd254bfee2473c808399a1b897/invoke.js"></script>
    </div>

    <script>
        let currentCalendar = 'gregorian';

        function setCalendar(type) {
            currentCalendar = type;
            if (type === 'gregorian') {
                document.getElementById('gregorianBtn').classList.add('active');
                document.getElementById('hijriBtn').classList.remove('active');
                document.getElementById('gregorianInputSection').style.display = 'block';
                document.getElementById('hijriInputSection').style.display = 'none';
            } else {
                document.getElementById('hijriBtn').classList.add('active');
                document.getElementById('gregorianBtn').classList.remove('active');
                document.getElementById('gregorianInputSection').style.display = 'none';
                document.getElementById('hijriInputSection').style.display = 'block';
            }
        }

        // تحويل تقريبي وبسيط للمساعدة في الحساب بين الهجري والميلادي
        function hijriToGregorian(hDay, hMonth, hYear) {
            const mYear = Math.floor(hYear * 0.97 + 622);
            const mMonth = hMonth; 
            const mDay = hDay;
            return new Date(mYear, mMonth - 1, mDay);
        }

        function processAgeCalculation() {
            let birthDate;

            if (currentCalendar === 'gregorian') {
                const gDateInput = document.getElementById('gregorianDate').value;
                if (!gDateInput) { alert('الرجاء تحديد تاريخ الميلاد الميلادي!'); return; }
                birthDate = new Date(gDateInput);
            } else {
                const hDay = parseInt(document.getElementById('hijriDay').value);
                const hMonth = parseInt(document.getElementById('hijriMonth').value);
                const hYear = parseInt(document.getElementById('hijriYear').value);

                if (!hDay || !hMonth || !hYear) { alert('الرجاء إدخال التاريخ الهجري كاملاً!'); return; }
                birthDate = hijriToGregorian(hDay, hMonth, hYear);
            }

            const today = new Date();
            if (birthDate > today) { alert('التاريخ لا يمكن أن يكون في المستقبل!'); return; }

            // حساب الفروقات بدقة
            let years = today.getFullYear() - birthDate.getFullYear();
            let months = today.getMonth() - birthDate.getMonth();
            let days = today.getDate() - birthDate.getDate();

            if (days < 0) {
                months--;
                const prevMonth = new Date(today.getFullYear(), today.getMonth(), 0);
                days += prevMonth.getDate();
            }
            if (months < 0) {
                years--;
                months += 12;
            }

            // عرض البيانات المتقدمة
            document.getElementById('resAge').innerHTML = `<span>${years}</span> سنة، و <span>${months}</span> شهر، و <span>${days}</span> يوم.`;
            
            const daysOfWeek = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
            document.getElementById('resDayName').innerText = daysOfWeek[birthDate.getDay()];

            // حساب موعد العيد القادم
            let nextBD = new Date(today.getFullYear(), birthDate.getMonth(), birthDate.getDate());
            if (today > nextBD) { nextBD.setFullYear(today.getFullYear() + 1); }
            const diff = Math.ceil((nextBD - today) / (1000 * 60 * 60 * 24));
            document.getElementById('resNextBirthday').innerText = (diff === 365 || diff === 0) ? "اليوم هو عيد ميلادك! 🎉" : `${diff} يوم`;

            document.getElementById('resultBox').style.display = 'block';
        }

        function resetForm() {
            document.getElementById('gregorianDate').value = '';
            document.getElementById('hijriDay').value = '';
            document.getElementById('hijriYear').value = '';
            document.getElementById('resultBox').style.display = 'none';
        }
    </script>
</body>
</html>
